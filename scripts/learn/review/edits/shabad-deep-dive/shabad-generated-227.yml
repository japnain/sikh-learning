{
  "title": "All belong to the One who belongs to all",
  "summary": "The shabad begins by overturning private ownership: all are Yours, and You belong to all. It widens into dependence, prayer, nearness, and the recognition that without the Lord there is not even a place to stand.",
  "whyItMatters": "This is for the person shrinking worth into possession, status, or exclusivity. Held honestly, it changes the emotional climate from scarcity to shared dependence and from ego to belonging.",
  "takeaway": "Belonging is received from the One who holds everyone.",
  "structure": [
    "It opens by taking ownership language and breaking it open into universal belonging.",
    "The middle shows every life begging, praying, and receiving from the same Source.",
    "It ends by revealing how little ground ego had to stand on without the Lord."
  ]
}
