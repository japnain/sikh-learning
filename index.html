    <meta name="twitter:image" content="https://naamras.xyz/icons/icon-512.png" />
    <title>NaamRas</title>
    <script>
      (function () {
        var storageKey = 'sikh-theme'
        var lightThemeColor = '#e5dfd2'
        var darkThemeColor = '#111923'

        function readStoredTheme() {
          try {
            var stored = window.localStorage.getItem(storageKey)
            if (!stored) return null
            var parsed = JSON.parse(stored)
            var mode = parsed && parsed.state ? parsed.state.mode : parsed && parsed.mode
            if (mode === 'system') return null
            if (mode === 'dark' || mode === 'light') return mode === 'dark'
            var value = parsed && parsed.state && typeof parsed.state.dark !== 'undefined'
              ? parsed.state.dark
              : parsed && parsed.dark
            return typeof value === 'boolean' ? value : null
          } catch (error) {
            return null
          }
        }

        var storedDark = readStoredTheme()
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = storedDark === null ? !!prefersDark : storedDark
        var root = document.documentElement
        root.classList.toggle('dark', isDark)
        root.dataset.theme = isDark ? 'dark' : 'light'
        root.style.colorScheme = isDark ? 'dark' : 'light'

        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.setAttribute('content', isDark ? darkThemeColor : lightThemeColor)
        }
      })()
    </script>
    <style>
      /* Inline splash to prevent FOUC */
      html { background-color: #e5dfd2; }
      html.dark { background-color: #111923; }
      body { background-color: #e5dfd2; margin: 0; }
      html.dark body { background-color: #111923; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
